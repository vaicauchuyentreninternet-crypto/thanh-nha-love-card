:root{--cr:#FFF7F0;--pk:#F6C9D5;--ch:#E85D78;--bt:#FFD77A;--lv:#C9B8EA;--mt:#B9DDCC;--co:#6D4B5B;--gold:#D6B16F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 18%,#FFF7F0 0,#F9DCE5 58%,#E8D3EE 100%);font-family:"Baloo 2",system-ui,sans-serif;color:var(--co);user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
#cap{position:fixed;z-index:5;left:50%;top:max(14px,env(safe-area-inset-top));width:min(92vw,760px);margin:0;padding:0 12px;transform:translateX(-50%);text-align:center;font:800 clamp(21px,4.8vw,38px)/1.12 "Baloo 2",system-ui,sans-serif;letter-spacing:.005em;color:#6D4B5B;text-shadow:0 2px 0 #fff7f0,0 0 16px #fff7f0;pointer-events:none}
#cap.w{animation:wr 1.1s cubic-bezier(.4,0,.2,1) both}
@keyframes wr{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 -2% 0 0)}}
#hint{position:fixed;z-index:6;pointer-events:none;transform:translate(-50%,-100%);background:var(--cr);padding:5px 15px;border:1px solid #F0D8D4;border-radius:999px;font:800 clamp(16px,3.8vw,21px)/1.2 "Baloo 2",system-ui,sans-serif;color:var(--co);box-shadow:0 4px 0 #F6C9D5,0 10px 22px #6D4B5B18;white-space:nowrap;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{margin-top:-7px}}
#actions{position:fixed;z-index:12;inset:0;pointer-events:none}
.page-action{position:fixed;pointer-events:auto;min-height:48px;padding:9px 25px;border:1px solid rgba(255,255,255,.8);border-radius:999px;background:linear-gradient(180deg,#F17891 0%,#E85D78 100%);color:#fff;font:800 clamp(17px,3.9vw,22px)/1.1 "Baloo 2",system-ui,sans-serif;letter-spacing:.01em;box-shadow:0 5px 0 #B8405A,0 12px 22px #A83B5A35,inset 0 1px 0 #ffffffa8;cursor:pointer;white-space:nowrap;transition:box-shadow .18s ease,filter .18s ease,top .25s cubic-bezier(.34,1.56,.64,1),left .25s cubic-bezier(.34,1.56,.64,1);translate:-50% 0}
.page-action:hover{filter:brightness(1.04);box-shadow:0 6px 0 #B8405A,0 15px 26px #A83B5A42,inset 0 1px 0 #ffffffb8}
.page-action:active{transform:translateY(3px);box-shadow:0 2px 0 #B8405A,0 7px 14px #A83B5A30}
#yes{left:calc(50% - 88px);top:68%}
#no2{left:calc(50% + 88px);top:68%;background:linear-gradient(180deg,#D7C8F0 0%,#BCA8E5 100%);color:#5C4C79;box-shadow:0 5px 0 #9784C4,0 12px 22px #8069B033,inset 0 1px 0 #ffffffb8}
#no2:active{box-shadow:0 2px 0 #9784C4,0 7px 14px #8069B030}
#no2.fx{translate:0 0;z-index:14}
#cl{left:50%;top:71%}
#turn-hint{position:fixed;z-index:5;right:22px;top:max(68px,calc(env(safe-area-inset-top) + 62px));left:auto;transform:none;max-width:min(44vw,250px);padding:5px 13px;border:1px solid #ffffff9c;border-radius:999px;background:#fff7f0bd;color:#856B75;font:700 clamp(12px,2.7vw,15px)/1.2 "Baloo 2",system-ui,sans-serif;letter-spacing:.01em;text-align:center;white-space:nowrap;pointer-events:none;opacity:.82;transition:opacity .2s ease;backdrop-filter:blur(8px)}
#envelope-prompt{position:fixed;z-index:10;left:50%;top:64%;transform:translateX(-50%);padding:7px 19px;border:1px solid #ffffffd0;border-radius:999px;background:linear-gradient(180deg,#fffdf9,#f9e8eb);color:#B44E69;font:800 clamp(17px,3.7vw,22px)/1.1 "Baloo 2",system-ui,sans-serif;box-shadow:0 4px 0 #EBC8D1,0 12px 22px #6D4B5B20;pointer-events:none;white-space:nowrap}
#edge-cue{position:fixed;z-index:4;left:calc(50% + min(19vw,205px));top:51%;width:28px;height:38px;transform:translateY(-50%);background:linear-gradient(135deg,#fffdf8 0%,#f5dbe0 55%,#d9b7c4 100%);clip-path:polygon(0 0,100% 100%,0 100%);filter:drop-shadow(0 5px 7px #6d4b5b40);opacity:.86;pointer-events:none;animation:edgeBreathe 2.4s ease-in-out infinite}
#edge-cue[data-direction="previous"]{left:auto;right:calc(50% + min(19vw,205px));transform:translateY(-50%) scaleX(-1)}
#edge-cue[data-direction="both"]{left:calc(50% + min(19vw,205px))}
@keyframes edgeBreathe{50%{opacity:.45;transform:translateY(-50%) translateX(3px)}}
#paper-grain{position:fixed;z-index:3;inset:0;pointer-events:none;opacity:.085;mix-blend-mode:multiply;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E")}
#hidden-controls{display:none!important}
#fb{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;font-size:30vmin}
body:not(.fb) #fb{display:none}body.fb #c{display:none}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #B79ADD;outline-offset:4px}
@media(max-width:700px){
 #cap{top:max(12px,env(safe-area-inset-top));font-size:clamp(20px,5.7vw,29px);width:94vw}
 #yes{left:calc(50% - 78px);top:69%;padding:9px 18px;min-height:44px;font-size:17px}
 #no2{left:calc(50% + 78px);top:69%;padding:9px 18px;min-height:44px;font-size:17px}
 #cl{top:72%;padding:9px 22px;min-height:44px;font-size:18px}
 #turn-hint{right:12px;top:max(58px,calc(env(safe-area-inset-top) + 54px));max-width:48vw;font-size:12px}
 #edge-cue{left:calc(50% + 26vw);width:22px;height:32px}
 #envelope-prompt{top:66%;font-size:17px}
 #edge-cue[data-direction="previous"]{right:calc(50% + 26vw)}
 #edge-cue[data-direction="both"]{left:calc(50% + 26vw)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  const $ = (selector) => document.querySelector(selector);

  document.body.appendChild(actions);

  const grain = document.createElement('div');
  grain.id = 'paper-grain';
  document.body.appendChild(grain);
  const edgeCue = document.createElement('div');
  edgeCue.id = 'edge-cue';
  edgeCue.setAttribute('aria-hidden', 'true');
  document.body.appendChild(edgeCue);
  const turnHint = document.createElement('div');
  turnHint.id = 'turn-hint';
  turnHint.setAttribute('aria-live', 'polite');
  document.body.appendChild(turnHint);
  const envelopePrompt = document.createElement('div');
  envelopePrompt.id = 'envelope-prompt';
  envelopePrompt.dataset.v = '3';
  envelopePrompt.textContent = 'M\u1EDF ra';
  document.body.appendChild(envelopePrompt);

  function pageBounds(card, index) {
    const page = card.pages[index];
    if (!card.vec3 || !page) return null;
    page.updateMatrixWorld(true);
    card.camera.updateMatrixWorld(true);
    const W = card.pageWidth;
    const H = card.pageHeight;
    const rect = canvas.getBoundingClientRect();
    const corners = [
      [0, -H / 2], [W, -H / 2], [0, H / 2], [W, H / 2],
    ];
    const points = corners.map(([x, z]) => {
      const p = card.vec3(x, 0, z).applyMatrix4(page.matrixWorld).project(card.camera);
      return {
        x: rect.left + (p.x * 0.5 + 0.5) * rect.width,
        y: rect.top + (-p.y * 0.5 + 0.5) * rect.height,
      };
    });
    return {
      left: Math.min(...points.map((p) => p.x)),
      right: Math.max(...points.map((p) => p.x)),
      top: Math.min(...points.map((p) => p.y)),
      bottom: Math.max(...points.map((p) => p.y)),
    };
  }

  function applySkillFinish(card) {
    if (!card.pages || !card.pageGroups || !card.material || !card.addMesh || !card.box) return;
    card.pages.forEach((page) => {
      const slab = page.children.find((child) => child.isMesh);
      if (slab) {
        const materials = Array.isArray(slab.material) ? slab.material : [slab.material];
        materials.forEach((material) => {
          material.roughness = 0.96;
          material.metalness = 0.005;
          if ('bumpScale' in material) material.bumpScale = 0.16;
          material.needsUpdate = true;
        });
      }
    });

    card.pageGroups.forEach((group, index) => {
      if (!group || group.userData.paperFrameAdded) return;
      group.userData.paperFrameAdded = true;
      const gold = card.material(0xD6B16F);
      gold.metalness = 0.3;
      gold.roughness = 0.48;
      gold.bumpScale = 0.06;
      gold.needsUpdate = true;
      const W = card.pageWidth;
      const H = card.pageHeight;
      const inset = 0.16;
      const barH = 0.016;
      const barD = 0.012;
      const y = 0.018;
      const horizontal = card.box(W - inset * 2, barH, barD);
      const vertical = card.box(barD, barH, H - inset * 2);
      card.addMesh(group, horizontal, gold, 0, y, -H / 2 + inset);
      card.addMesh(group, horizontal, gold, 0, y, H / 2 - inset);
      card.addMesh(group, vertical, gold, -W / 2 + inset, y, 0);
      card.addMesh(group, vertical, gold, W / 2 - inset, y, 0);
      if (card.sphere) {
        [[-W / 2 + inset, -H / 2 + inset], [W / 2 - inset, -H / 2 + inset], [-W / 2 + inset, H / 2 - inset], [W / 2 - inset, H / 2 - inset]].forEach(([x, z]) => {
          const bead = card.addMesh(group, card.sphere, gold, x, y + 0.008, z);
          bead.scale.set(0.027, 0.018, 0.027);
        });
      }
    });

    if (card.renderer) {
      card.renderer.toneMappingExposure = 1.04;
      card.renderer.shadowMap.enabled = true;
    }
  }

  function updateHint(card) {
    const index = card.i;
    const copy = [
      'K\u00E9o m\u00E9p gi\u1EA5y sang tr\u00E1i \u0111\u1EC3 m\u1EDF',
      'K\u00E9o trang sang tr\u00E1i \u0111\u1EC3 ti\u1EBFp t\u1EE5c',
      'K\u00E9o trang sang tr\u00E1i \u0111\u1EC3 ti\u1EBFp t\u1EE5c',
      'M\u1EDF l\u00E1 th\u01B0, r\u1ED3i k\u00E9o trang ti\u1EBFp nh\u00E9',
      'Ch\u1ECDn c\u00E2u tr\u1EA3 l\u1EDDi c\u1EE7a em \u2661',
      'M\u00F3n qu\u00E0 ch\u1EDD l\u1EA7n g\u1EB7p ti\u1EBFp theo',
    ];
    turnHint.textContent = copy[index] || '';
    if (index === 0) envelopePrompt.textContent = 'M\u1EDF ra';
    turnHint.hidden = false;
    edgeCue.hidden = index === 4;
    edgeCue.dataset.direction = index === 0 ? 'next' : index === 5 ? 'previous' : 'both';
  }

  function resetNo() {
    no.classList.remove('fx');
    no.style.left = '';
    no.style.top = '';
  }

  let lastDodge = 0;
  function dodgeNo(event) {
    if (Number(body.dataset.s) !== 4) return;
    if (event?.cancelable) event.preventDefault();
    const now = performance.now();
    if (now - lastDodge < 130) return;
    lastDodge = now;
    const card = window.__card;
    const area = card ? pageBounds(card, 4) : null;
    const rect = no.getBoundingClientRect();
    const yesRect = yes.getBoundingClientRect();
    const leftMin = Math.max(12, area ? area.left + (area.right - area.left) * 0.12 : innerWidth * 0.2);
    const leftMax = Math.min(innerWidth - rect.width - 12, area ? area.right - rect.width - (area.right - area.left) * 0.12 : innerWidth * 0.8 - rect.width);
    const topMin = Math.max(12, area ? area.top + (area.bottom - area.top) * 0.5 : innerHeight * 0.48);
    const topMax = Math.min(innerHeight - rect.height - 12, area ? area.bottom - rect.height - (area.bottom - area.top) * 0.1 : innerHeight * 0.82 - rect.height);
    if (!no.classList.contains('fx')) {
      no.style.left = rect.left + 'px';
      no.style.top = rect.top + 'px';
      no.classList.add('fx');
      void no.offsetWidth;
    }
    let x = leftMin;
    let y = topMin;
    for (let attempt = 0; attempt < 90; attempt += 1) {
      x = leftMin + Math.random() * Math.max(1, leftMax - leftMin);
      y = topMin + Math.random() * Math.max(1, topMax - topMin);
      const clear = x > yesRect.right + 16 || x + rect.width < yesRect.left - 16 || y > yesRect.bottom + 16 || y + rect.height < yesRect.top - 16;
      if (clear && Math.hypot(x - rect.left, y - rect.top) > 85) break;
    }
    no.style.left = x + 'px';
    no.style.top = y + 'px';
  }

  ['pointerenter', 'pointerdown', 'touchstart', 'focus'].forEach((type) => {
    no.addEventListener(type, dodgeNo, { passive: false });
  });
  no.addEventListener('click', (event) => {
    event.preventDefault();
    dodgeNo(event);
  });
  window.addEventListener('pointermove', (event) => {
    if (Number(body.dataset.s) !== 4) return;
    const rect = no.getBoundingClientRect();
    if (Math.hypot(event.clientX - (rect.left + rect.width / 2), event.clientY - (rect.top + rect.height / 2)) < 76) dodgeNo();
  });

  let drag = null;
  let lastIndex = -1;
  function startDrag(event) {
    const card = window.__card;
    if (!card || card.busy || event.target !== canvas) return;
    const index = card.i;
    const bounds = pageBounds(card, index);
    if (!bounds || event.clientX < bounds.left - 12 || event.clientX > bounds.right + 12 || event.clientY < bounds.top - 12 || event.clientY > bounds.bottom + 12) return;
    drag = {
      index,
      x: event.clientX,
      y: event.clientY,
      time: performance.now(),
      dir: 0,
      target: -1,
      progress: 0,
      moved: false,
      baseRotation: 0,
      baseY: 0,
      pageWidth: Math.max(140, bounds.right - bounds.left),
    };
    try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
  }

  function moveDrag(event) {
    if (!drag) return;
    const card = window.__card;
    if (!card || card.busy) return;
    const dx = event.clientX - drag.x;
    const dy = event.clientY - drag.y;
    if (!drag.dir && Math.abs(dx) > 9 && Math.abs(dx) > Math.abs(dy) * 1.15) {
      const direction = dx < 0 ? 1 : -1;
      if (direction > 0 && (drag.index >= 5 || drag.index === 4)) return;
      if (direction < 0 && drag.index <= 0) return;
      drag.dir = direction;
      drag.target = direction > 0 ? drag.index : drag.index - 1;
      const page = card.pages[drag.target];
      if (!page) return;
      drag.baseRotation = page.rotation.z;
      drag.baseY = page.position.y;
      card.pageGroups[drag.target].visible = true;
      card.dragging = true;
    }
    if (!drag.dir) return;
    drag.moved = true;
    const raw = drag.dir > 0 ? -dx : dx;
    const progress = clamp(raw / (drag.pageWidth * 0.78), 0, 0.96);
    drag.progress = progress;
    const page = card.pages[drag.target];
    const endRotation = drag.dir > 0 ? Math.PI : 0;
    const endY = drag.dir > 0 ? card.pageYLeft(drag.target) : card.pageYRight(drag.target);
    page.rotation.z = drag.baseRotation + (endRotation - drag.baseRotation) * progress;
    page.rotation.x = Math.sin(progress * Math.PI) * 0.095 * drag.dir;
    page.rotation.y = Math.sin(progress * Math.PI) * 0.035;
    page.position.y = drag.baseY + (endY - drag.baseY) * progress + Math.sin(progress * Math.PI) * 0.32;
    document.body.classList.add('dragging-page');
    turnHint.style.opacity = '0.25';
    event.preventDefault();
  }

  function animateBack(card, dragState) {
    const page = card.pages[dragState.target];
    const startRotation = page.rotation.z;
    const startY = page.position.y;
    const startX = page.rotation.x;
    const startYaw = page.rotation.y;
    const duration = 260;
    const began = performance.now();
    const ease = (t) => 1 - Math.pow(1 - t, 3);
    function frame(now) {
      const p = clamp((now - began) / duration, 0, 1);
      const e = ease(p);
      page.rotation.z = startRotation + (dragState.baseRotation - startRotation) * e;
      page.position.y = startY + (dragState.baseY - startY) * e;
      page.rotation.x = startX * (1 - e);
      page.rotation.y = startYaw * (1 - e);
      if (p < 1) requestAnimationFrame(frame);
      else {
        page.rotation.set(0, 0, dragState.baseRotation);
        page.position.y = dragState.baseY;
        card.pageGroups[dragState.target].visible = false;
        card.dragging = false;
        document.body.classList.remove('dragging-page');
        turnHint.style.opacity = '';
      }
    }
    requestAnimationFrame(frame);
  }

  function endDrag(event) {
    if (!drag) return;
    const state = drag;
    drag = null;
    if (!state.dir || !state.moved) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    const card = window.__card;
    if (!card) return;
    const dx = event.clientX - state.x;
    const raw = state.dir > 0 ? -dx : dx;
    const elapsed = Math.max(1, performance.now() - state.time);
    const velocity = raw / elapsed;
    const commit = state.progress > 0.24 || (raw > 36 && velocity > 0.32);
    document.body.classList.remove('dragging-page');
    turnHint.style.opacity = '';
    if (commit) {
      const targetIndex = state.index + state.dir;
      const result = card.go(targetIndex);
      card.dragging = false;
      Promise.resolve(result).catch(() => {});
    } else {
      animateBack(card, state);
    }
  }

  canvas.addEventListener('pointerdown', startDrag, true);
  canvas.addEventListener('pointermove', moveDrag, true);
  canvas.addEventListener('pointerup', endDrag, true);
  canvas.addEventListener('pointercancel', (event) => {
    if (!drag) return;
    const state = drag;
    drag = null;
    if (state.dir && state.moved && window.__card) animateBack(window.__card, state);
  }, true);

  function onPageChange() {
    const card = window.__card;
    if (!card) return;
    if (card.i !== lastIndex) {
      lastIndex = card.i;
      resetNo();
      updateHint(card);
    }
  }

  function waitForRenderer() {
    const card = window.__card;
    if (!card || !card.pages || !card.vec3 || !card.material) {
      requestAnimationFrame(waitForRenderer);
      return;
    }
    applySkillFinish(card);
    updateHint(card);
    lastIndex = card.i;
    const observer = new MutationObserver(onPageChange);
    observer.observe(body, { attributes: true, attributeFilter: ['data-s'] });
    window.addEventListener('resize', () => {
      if (Number(body.dataset.s) === 4 && no.classList.contains('fx')) resetNo();
      onPageChange();
    });
    const envelopeGroup = card.S?.[3]?.g;
    const originalEnvelopeTap = envelopeGroup?.userData?.tap;
    if (typeof originalEnvelopeTap === 'function' && !envelopeGroup.userData.tapPatched) {
      envelopeGroup.userData.tapPatched = true;
      envelopeGroup.userData.tap = (...args) => {
        const result = originalEnvelopeTap(...args);
        envelopePrompt.textContent = 'K\u00E9o trang đ\u1EC3 đ\u1ECDc th\u01B0';
        return result;
      };
    }
  }
  waitForRenderer();
})();
</script>
</body>
</html>
